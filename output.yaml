    FilingDetailsRead:
      properties:
        input_vat_recovery_rate:
          anyOf:
            - type: "string"
              pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
            - type: "null"
          title: "Input Vat Recovery Rate"
          description: "Input VAT recovery rate applied to this filing, as a percentage 0-100. Null when no rate exists for the filing's country and year, which means fully recoverable. Uses the definitive rate when set, otherwise the year's frozen provisional."
        input_vat_recovery_rate_is_definitive:
          anyOf:
            - type: "boolean"
            - type: "null"
          title: "Input Vat Recovery Rate Is Definitive"
          description: "True when input_vat_recovery_rate is this year's definitive rate. False when it is the provisional. Null when no rate exists."
        status:
          $ref: "#/components/schemas/FilingStatusEnum"
          description: "Filing status. Possible values:\n                                    UNFILED, FILING, FILED, PAUSED, SKIPPED, CANCELLED, ISSUE."
          default: "UNFILED"
        start_date:
          type: "string"
          format: "date"
          title: "Start Date"
          description: "The start date of the filing period."
        end_date:
          type: "string"
          format: "date"
          title: "End Date"
          description: "The end date of the filing period."
        due_date:
          anyOf:
            - type: "string"
              format: "date"
            - type: "null"
          title: "Due Date"
          description: "The due date of the filing."
        date_filed:
          anyOf:
            - type: "string"
              format: "date"
            - type: "null"
          title: "Date Filed"
          description: "The date the filing was completed, if applicable."
        is_manual:
          anyOf:
            - type: "boolean"
            - type: "null"
          title: "Is Manual"
          description: "Indicates if the filing was done manually."
        state_code:
          anyOf:
            - type: "string"
            - type: "null"
          title: "State Code"
          description: "The code of the state associated with the filing (e.g., IA, NY)."
        state_name:
          anyOf:
            - type: "string"
            - type: "null"
          title: "State Name"
          description: "The name of the state associated with the filing\n        (e.g., Iowa, New York)."
        country_code:
          $ref: "#/components/schemas/CountryCodeEnum"
          description: "Country code in ISO 3166-1 alpha-2 format (e.g., US)."
        auto_approved:
          anyOf:
            - type: "boolean"
            - type: "null"
          title: "Auto Approved"
          description: "Indicates if the filing was auto-approved. Defaults to false."
          default: false
        paused_until_date:
          anyOf:
            - type: "string"
              format: "date"
            - type: "null"
          title: "Paused Until Date"
          description: "Indicates the date when filing will be unpaused."
        assistance_ticket_id:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Assistance Ticket Id"
          description: "DevRev ticket DON for the active assistance-pause episode. Cleared when the filing is approved from PAUSED."
        filing_category:
          type: "string"
          maxLength: 50
          title: "Filing Category"
          description: "Category of filing. Common values:\n                                    REGULAR (standard periodic filing),\n                                    BACK_FILING (past-due period),\n                                    AMENDMENT (amended return).\n                                    Prepayment is ``is_prepayment``, not a category.\n                                    Different categories can have overlapping periods."
          default: "REGULAR"
        is_prepayment:
          type: "boolean"
          title: "Is Prepayment"
          description: "True when this filing is a prepayment obligation. Independent of filing_category so a past-due prepayment can still be BACK_FILING."
          default: false
        is_final:
          type: "boolean"
          title: "Is Final"
          description: "True when this filing is a final return for deregistration. Independent of filing_category — finals stay REGULAR."
          default: false
        approved_by:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Approved By"
          description: "User ID of who approved the filing."
        approved_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Approved At"
          description: "Timestamp when the filing was approved."
        issue_reason:
          anyOf:
            - type: "string"
              maxLength: 50
            - type: "null"
          title: "Issue Reason"
          description: "Reason why the filing has an issue, if applicable."
        skip_reason:
          anyOf:
            - type: "string"
              maxLength: 50
            - type: "null"
          title: "Skip Reason"
          description: "Reason why the filing was skipped, if applicable."
        cancelled_reason:
          anyOf:
            - type: "string"
              maxLength: 50
            - type: "null"
          title: "Cancelled Reason"
          description: "Reason why the filing was cancelled, if applicable."
        tax_type:
          $ref: "#/components/schemas/TaxTypeEnum"
          description: "Which taxes this filing return covers. SALES_AND_USE_TAX is one real return covering both; USE_TAX is a standalone consumer use tax return."
          default: "SALES_TAX"
        is_rdf:
          type: "boolean"
          title: "Is Rdf"
          description: "True when this filing is a state Retail Delivery Fee return, a separate filing from the state's sales tax return."
          default: false
        amount_calculated:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Calculated"
          description: "The calculated amount for the filing. Defaults to 0.00."
          default: "0.00"
        amount_adjusted:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Adjusted"
          description: "Adjusted amount, if any."
          default: "0.00"
        amount_discounts:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Discounts"
          description: "Discounts applied to the filing."
          default: "0.00"
        amount_fees:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Fees"
          description: "Fees applied to the filing."
          default: "0.00"
        amount_penalties:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Penalties"
          description: "Penalties applied to the filing."
          default: "0.00"
        amount_tax_collected:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Tax Collected"
          description: "Total tax collected during the filing period."
          default: "0.00"
        amount_use_tax:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Use Tax"
          description: "Gross tax the buyer owes on purchases. US use tax, or EU/UK reverse-charge self-assessed VAT. Not net of recoverable VAT. Defaults to 0.00."
          default: "0.00"
        amount_input_vat_recoverable:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Input Vat Recoverable"
          description: "Input VAT this filing actually claimed. Subtracted from liability; always 0.00 outside EU/UK VAT filings."
          default: "0.00"
        amount_input_vat_true_up:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Input Vat True Up"
          description: "Prior-year input VAT pro-rata true-up on this filing. Negative claims more, positive repays. Always 0.00 until posted."
          default: "0.00"
        amount_input_vat_recoverable_base:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Input Vat Recoverable Base"
          description: "Input VAT this filing would have claimed at a 100% rate. Always 0.00 outside EU/UK VAT filings."
          default: "0.00"
        input_vat_recovery_rate_applied:
          anyOf:
            - type: "string"
              pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,3}|(?=[\\d.]{1,13}0*$)\\d{0,3}\\.\\d{0,9}0*$)"
            - type: "null"
          title: "Input Vat Recovery Rate Applied"
          description: "Rate actually used on this filing's reclaim. Null when this filing is not EU/UK VAT."
        amount_sales:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount Sales"
          description: "Total sales amount during the filing period."
          default: "0.00"
        total_taxable_sales:
          anyOf:
            - type: "string"
              pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
            - type: "null"
          title: "Total Taxable Sales"
          description: "Total taxable amount during the filing period."
          default: "0.00"
        amount:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Amount"
          description: "Final amount due for the filing."
          default: "0.00"
        total_tax_liability:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Total Tax Liability"
          description: "Total tax liability for the filing."
          default: "0.00"
        transaction_count:
