info:
  title: "Kintsugi Customer API"
  version: "1.0.0"
  x-spec-synced-at: "2026-09-18T00:01:29.632Z"
  description: "Publicly documented Kintsugi Customer API endpoints. The source (openapi/_source/openapi-master.json) is the platform spec filtered to the documented customer surface (openapi/customer-endpoints.json); scripts/build-specs.mjs re-applies that filter here. Do not edit by hand."
  x-spec-source: "committed openapi-master.json"
  x-spec-checked-at: "2026-09-18T00:01:29.632Z"
paths:
  /v1/address_validation/search:
    post:
      tags:
        - "Address Validation"
      summary: "Search"
      description: "This API validates and enriches address information\n    submitted by the user. It ensures that the address is standardized, accurate,\n    and compliant with geographical and postal standards.\n    The API also adds additional fields, such as county, when possible."
      operationId: "search_v1_address_validation_search_post"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBase"
            example:
              phone: "555-123-4567"
              street_1: "1600 Amphitheatre Parkway"
              street_2: "Building 40"
              city: "Mountain View"
              county: "Santa Clara"
              state: "CA"
              postal_code: "94043"
              country: "US"
              full_address: "1600 Amphitheatre Parkway, Mountain View, CA 94043"
        required: true
      responses:
        "200":
          description: "Address found successfully"
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AddressSearchResponse"
                type: "array"
                title: "Response 200 Search V1 Address Validation Search Post"
              example:
                - address_submitted:
                    street_1: "1600 Amphitheatre Parkway"
                    street_2: ""
                    city: "Mountain View"
                    county: ""
                    state: "CA"
                    postal_code: "94043"
                    country: "US"
                    full_address: ""
                  response_address:
                    street_1: "1600 AMPHITHEATRE PARKWAY"
                    street_2: ""
                    city: "MOUNTAIN VIEW"
                    county: "SANTA CLARA"
                    state: "CA"
                    postal_code: "94043"
                    country: "US"
                    full_address: ""
                  verification_status: "VERIFIED"
                  enrich_fields:
                    - "county"
        "401":
          description: "The request is missing a valid x-api-key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: "Authorization header is missing or token is invalid."
        "422":
          description: "Validation error - Address fields failed validation or are incomplete"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/backend__src__address_validation__responses__ValidationErrorResponse"
              example:
                detail:
                  - type: "missing"
                    loc:
                      - "body"
                    msg: "Field required"
        "500":
          description: "An unexpected server error occurred."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: "An unexpected error occurred."
      security:
        - APIKeyHeader: []
      x-public: true
      x-speakeasy-group: addressValidation
      x-speakeasy-name-override: search
  /v1/address_validation/suggestions:
    post:
      tags:
        - "Address Validation"
      summary: "Suggestions"
      description: "This API endpoint provides address suggestions based on\n    partial input data. It helps users auto-complete and validate addresses efficiently\n    by returning a list of suggested addresses that match the input criteria.\n    This improves accuracy, increases speed, reduces errors,\n    and streamlines the data entry process."
      operationId: "suggestions_v1_address_validation_suggestions_post"
      security:
        - APIKeyHeader: []
      parameters:
        - name: "x-organization-id"
          in: "header"
          required: true
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            description: "The unique identifier for the organization making the request"
            title: "X-Organization-Id"
          description: "The unique identifier for the organization making the request"
          example: "org_12345"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationAddress"
            example:
              line1: "1600 Amphitheatre Parkway"
              line2: ""
              line3: ""
              city: "Mountain View"
              state: "CA"
              postalCode: "94043"
              id: 215
              county: ""
              full_address: "1600 Amphitheatre Parkway, Mountain View, CA 94043"
              country: "US"
      responses:
        "200":
          description: "Successfully retrieved address suggestions"
          content:
            application/json:
              schema: {}
              example:
                - city: "MOUNTAIN VIEW"
                  county: "Santa Clara County"
                  state: "CA"
                  postal_code: "94043"
                  country: "US"
                - city: "MOUNTAIN VIEW"
                  county: "Santa Clara County"
                  state: "CA"
                  postal_code: "94040"
                  country: "US"
        "401":
          description: "The request is missing a valid x-api-key."
          content:
            application/json:
              example:
                detail: "Authorization header is missing or token is invalid."
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error - Address fields failed validation or are incomplete"
          content:
            application/json:
              example:
                detail:
                  - type: "missing"
                    loc:
                      - "body"
                    msg: "Field required"
              schema:
                $ref: "#/components/schemas/backend__src__address_validation__responses__ValidationErrorResponse"
        "500":
          description: "An unexpected server error occurred."
          content:
            application/json:
              example:
                detail: "An unexpected error occurred."
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-public: true
      x-speakeasy-group: addressValidation
      x-speakeasy-name-override: suggestions
  /v1/customers:
    get:
      tags:
        - "Customers"
      summary: "Get customers"
      description: "The Get Customers API retrieves\n    a paginated list of customers based on specified filters.\n    This API allows searching, filtering by country and state, and sorting the results."
      operationId: "get_customers_v1"
      security:
        - APIKeyHeader: []
      parameters:
        - name: "search_query"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            description: "Search term to filter customers by name or other details"
            title: "Search Query"
          description: "Search term to filter customers by name or other details"
          example: "John"
        - name: "country"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "array"
                items:
                  anyOf:
                    - $ref: "#/components/schemas/CountryCodeEnum"
                    - type: "string"
              - type: "null"
            description: "Country code in ISO 3166-1 alpha-2 format (e.g., 'US')"
            title: "Country"
          description: "Country code in ISO 3166-1 alpha-2 format (e.g., 'US')"
          example: "US"
        - name: "state"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            description: "State or province code to filter customers"
            title: "State"
          description: "State or province code to filter customers"
          example: "CA"
        - name: "source__in"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            description: "Filter customers by source (comma-separated)"
            title: "Source  In"
          description: "Filter customers by source (comma-separated)"
          example: "SHOPIFY,API"
        - name: "connection_id__in"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            description: "Filter customers by connection ID (comma-separated)"
            title: "Connection Id  In"
          description: "Filter customers by connection ID (comma-separated)"
          example: "conn_abc123,conn_def456"
        - name: "order_by"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            description: "Comma-separated list of fields to sort results by."
            title: "Order By"
          description: "Comma-separated list of fields to sort results by."
          example: "created_at,street_1,street_2,city,state,postal_code,country,status"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            default: 1
            title: "Page"
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 100
            minimum: 1
            default: 50
            title: "Size"
        - name: "x-organization-id"
          in: "header"
          required: true
          schema:
            anyOf:
              - type: "string"
              - type: "null"
            description: "The unique identifier for the organization making the request"
            title: "X-Organization-Id"
          description: "The unique identifier for the organization making the request"
          example: "org_12345"
      responses:
        "200":
          description: "Successfully retrieved customers"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_CustomerRead_"
              example:
                items:
                  - id: "cust_123abc"
                    organization_id: "org_456xyz"
                    name: "John Doe"
                    external_id: "cust_123"
                    status: "ACTIVE"
                    email: "john.doe@example.com"
                    phone: "+1234567890"
                    street_1: "123 Main Street"
                    street_2: "Apt 4B"
                    city: "San Francisco"
                    county: "San Francisco County"
                    state: "CA"
                    postal_code: "94105"
                    country: "US"
                    full_address: "123 Main Street, Apt 4B, San Francisco, CA 94105"
                    source: "BIGCOMMERCE"
                    connection_id: "conn_12345"
                    address_status: "UNVERIFIED"
                    external_friendly_id: "1234567890"
                total: 1
                page: 1
                size: 50
                pages: 1
        "401":
          description: "The request is missing a valid x-api-key."
          content:
            application/json:
              example:
                detail: "Authorization header is missing or token is invalid."
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Entered an incorrect URL."
          content:
            application/json:
              example:
                detail: "Resource Not Found"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
