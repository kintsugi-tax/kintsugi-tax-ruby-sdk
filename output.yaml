                type: "string"
                enum:
                  - "SHIP_TO"
                  - "BILL_TO"
                description: "Type of the address. Must be either\n                        SHIP_TO or BILL_TO."
              phone:
                type: "string"
                description: "Phone number associated with the customer."
              street_1:
                type: "string"
                description: "Primary street address of the customer."
              street_2:
                type: "string"
                description: "Additional street address details, such as an apartment or suite number."
              city:
                type: "string"
                description: "City where the customer resides."
              county:
                type: "string"
                description: "County or district of the customer."
              state:
                type: "string"
                description: "State or province of the address."
              postal_code:
                type: "string"
                description: "Postal code of the address."
              country:
                type: "string"
                description: "Country of the address."
              full_address:
                type: "string"
                description: "Complete address string of the customer, which can be used as an alternative to individual fields."
              status:
                type: "string"
                description: "Deprecated: ignored on estimate. Accepted for backward compatibility; each address is validated from structured fields."
                deprecated: true
              enriched_fields:
                type: "string"
                description: "Additional enriched fields related to the address."
              is_unincorporated:
                type: "boolean"
                description: "If true, city-level tax rates are not applied for this address."
                default: false
            type: "object"
            required:
              - "type"
              - "state"
              - "postal_code"
              - "country"
          type: "array"
          title: "The address information for this transaction."
          description: "List of addresses related to the transaction. At least one BILL_TO or SHIP_TO address must be provided. The address will be validated during estimation, and the transaction may be rejected if the address does not pass validation. The SHIP_TO will be preferred to use for determining tax liability. Optional per-address `status` is deprecated, accepted for backward compatibility, and ignored; estimation always validates from structured address fields."
        total_tax_amount_calculated:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Total Tax Amount Calculated"
          description: "The total amount of tax determined for the transaction."
          default: "0.00"
        taxable_amount:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,18}|(?=[\\d.]{1,21}0*$)\\d{0,18}\\.\\d{0,2}0*$)"
          title: "Taxable Amount"
