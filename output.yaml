          description: "Subcategory of the product. Required if product_category is used\n        in place of external_product_id."
        product_category:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Category of the product."
          description: "Category of the product. Required if product_subcategory is used\n        in place of external_product_id."
        quantity:
          anyOf:
            - type: "number"
            - type: "string"
              pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,20}|(?=[\\d.]{1,41}0*$)\\d{0,20}\\.\\d{0,20}0*$)"
          title: "Quantity of the product."
          description: "Defaults to 1.0. The quantity of the item."
          default: "1.0"
        amount:
          anyOf:
            - type: "number"
            - type: "string"
              pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,10}|(?=[\\d.]{1,13}0*$)\\d{0,10}\\.\\d{0,2}0*$)"
          title: "Total amount of this transaction item, after discounts."
          description: "The total amount of the item."
        exempt:
          type: "boolean"
          title: "Whether or not this transaction item is exempt from tax."
          description: "Defaults to false. Indicates whether the item is exempt from tax."
          default: false
        is_tax_inclusive:
          type: "boolean"
          title: "Whether this item's amount already contains tax."
          description: "**Beta — not yet available in production.** When it is not enabled for your environment the field is accepted but ignored, and the response echoes `false`.\n\nDefaults to false. When true, `amount` is the gross (tax-included) price and the tax is backed out of it rather than added on top; for a taxable line, `taxable_amount` in the response is then the net base.\n\nWhen the line is not taxed - exempt, or no tax rule applies in the destination - `taxable_amount` is `0.00` rather than the net base, matching how exempt tax-exclusive lines already behave. Read the net amount as `taxable_amount` when `tax_amount` is non-zero, and as `amount` otherwise.\n\nThis applies to the estimate in this request only. Transactions imported through a connection carry no such flag, so an order quoted here as gross is treated as net when it later syncs, and its recorded tax will be higher than this estimate. Send net amounts on the connection side, or reconcile the difference, until tax-inclusive import support ships."
