            - type: "null"
          description: "Source of exemption."
      type: "object"
      required:
        - "exemption_type"
        - "start_date"
      title: "TransactionEmbeddedExemption"
      description: "Public read schema mirroring the ORM ``Exemption`` for /v1 transaction embedding.\n\nA non-table twin of ``exemptions.models.Exemption``: it re-declares the exact fields\nthe ORM adds on top of ``ExemptionBase``/``TableBase`` (id, organization_id,\ncertificate_import_id, source) so ``TransactionSerializerBase.exemptions`` can be\ntyped without importing the private ORM model (CP-4895). Its serialized shape is\nbyte-identical to the ORM's — ``from_attributes`` reads the same attributes off each\nORM row — so the /v1 response payload is unchanged. Keep it in lockstep with\n``Exemption`` if the ORM's public columns change (a JSON-schema parity test guards it)."
