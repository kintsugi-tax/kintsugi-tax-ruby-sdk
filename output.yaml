          default: "0.00"
        tax_rate_calculated:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,3}|(?=[\\d.]{1,13}0*$)\\d{0,3}\\.\\d{0,9}0*$)"
          title: "Tax Rate Calculated"
          description: "The calculated tax rate for the transaction."
          default: "0.00"
