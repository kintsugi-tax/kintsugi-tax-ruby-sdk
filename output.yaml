          description: "Estimated schedule line count (distinct jurisdictions). For Tax Ops workload ranking, not portal accuracy."
        internal_notes:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Internal Notes"
          description: "Notes or comments related to the filing."
        recent_details_report_link:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Recent Details Report Link"
