      title: "PennsylvaniaAccountType"
      description: "Account ID types accepted when requesting third-party access on Pennsylvania myPATH.\n\nmyPATH identifies the account by one of these: a Business Use ID, an Account ID,\nor a Sales License ID."
    PennsylvaniaIdentificationType:
      type: "string"
      enum:
        - "FEIN"
        - "ITIN"
        - "REVENUE_ID"
        - "SSN"
      title: "PennsylvaniaIdentificationType"
      description: "Identification types accepted by Pennsylvania myPATH third-party access requests.\n\nmyPATH validates the requester against a federal/state identifier: an FEIN, ITIN,\nRevenue ID, or SSN."
    PennsylvaniaAccountValidationMethod:
      type: "string"
      enum:
        - "LETTER_ID"
        - "BUSINESS_REGISTRATION_CONFIRMATION_CODE"
        - "PAYMENT_AMOUNT"
        - "RETURN_LINE_ITEM"
      title: "PennsylvaniaAccountValidationMethod"
      description: "Account validation methods offered by Pennsylvania myPATH third-party access.\n\nThe requester proves ownership with exactly one of these: a Letter ID, a Business\nRegistration Confirmation Code, a Payment Amount, or a Return Line Item."
    TaxItemEstimate:
      properties:
        rate:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,3}|(?=[\\d.]{1,13}0*$)\\d{0,3}\\.\\d{0,9}0*$)"
          title: "The tax rate for this this jurisdiction and tax type."
          default: "0.0"
        name:
          type: "string"
          title: "The name of the tax item for this jurisdiction and tax type. ie. 'State Tax'"
        amount:
          type: "string"
          pattern: "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,10}|(?=[\\d.]{1,13}0*$)\\d{0,10}\\.\\d{0,2}0*$)"
          title: "The amount of tax determined for this jurisdiction and tax type."
          default: "0.0"
        exempt:
          type: "boolean"
          title: "True if this item is tax exempt."
          default: false
        exempt_reason:
          anyOf:
            - $ref: "#/components/schemas/TaxItemReturnReasonEnum"
            - type: "null"
          title: "The reason why we determined the tax item is exempt."
        rule:
          anyOf:
            - type: "string"
              maxLength: 50
            - type: "null"
          title: "The rule id that was used to determine the tax."
      type: "object"
      required:
        - "name"
      title: "TaxItemEstimate"
    TaxItemTypeEnum:
      type: "string"
      enum:
        - "IMPORTED_ORIGINAL"
        - "IMPORTED"
        - "CALCULATED"
      title: "TaxItemTypeEnum"
    JurisdictionType:
      type: "string"
      enum:
        - "COUNTRY"
        - "FEDERAL"
        - "STATE"
        - "COUNTY"
        - "CITY"
        - "SPECIAL"
        - "OTHER"
        - "HYBRID"
      title: "JurisdictionType"
    AppliedTo:
      type: "string"
      enum:
        - "TRANSACTION"
        - "TRANSACTION_ITEM"
      title: "AppliedTo"
    TaxItemReturnReasonEnum:
      type: "string"
      enum:
        - "NO_RULE_FOUND"
        - "RULE_FOUND_TAXABLE"
        - "RULE_FOUND_NOT_TAXABLE"
        - "RULE_FOUND_TAXABLE_ZERO_RATE"
        - "PRODUCT_EXEMPT"
        - "FROM_IMPORT"
        - "RULE_EXCLUDED_IN_CALCULATION"
        - "REVERSE_CHARGE"
      title: "TaxItemReturnReasonEnum"
      description: "We use this to understand the response from get_tax_items"
